<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ECU DUMMY TESTER</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; color: #fff; font-family: monospace; text-align: center; padding: 20px; }
        .box { border: 2px solid #333; padding: 20px; border-radius: 15px; margin-bottom: 10px; }
        .val { font-size: 3em; font-weight: bold; color: #00e676; }
        #status { color: #ffeb3b; }
        #dbg { color: #888; font-size: .8em; margin-top: 8px; word-break: break-all; }
        input { background: #111; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 6px; width: 130px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="box">
        <div>STATUS KONEKSI: <span id="status">SCANNING...</span></div>
        <div id="ip_found">Mencari Wemos di Jaringan...</div>
        <div style="margin-top:10px">IP Wemos: <input id="prefix" value="192.168"></div>
        <div style="color:#888;font-size:.75em;margin-top:6px">Isi <b>192.168</b> = cari otomatis (Wemos di angka akhir .99)<br><b>192.168.43</b> = cek semua .1 sampai .254<br><b>192.168.43.57</b> = IP lengkap (paling cepat)</div>
        <div id="dbg"></div>
    </div>

    <div class="box">
        <h2>ENGINE RPM (DUMMY)</h2>
        <div class="val" id="rpm">0</div>
    </div>

    <div class="box">
        <h2>GPS SPEED</h2>
        <div class="val" id="speed">0</div>
        <div id="gps_stat">GPS: SEARCHING...</div>
    </div>

    <script>
        let wemosIP = "";
        let isFound = false;
        let scanRound = 0;
        let lastErr = "";
        const $ = id => document.getElementById(id);

        // Opsi fetch: 'targetAddressSpace' memberi tahu Chrome bahwa tujuannya jaringan lokal
        // (supaya halaman HTTPS boleh memanggil http://192.168.x.x setelah izin diberikan)
        function req(ip) {
            const ctl = new AbortController();
            setTimeout(() => ctl.abort(), 1500);
            return fetch(`http://${ip}/data`, { mode: 'cors', targetAddressSpace: 'local', signal: ctl.signal, cache: 'no-store' })
                .then(r => r.json());
        }

        function found(ip) {
            if (isFound) return;
            isFound = true;
            wemosIP = ip;
            localStorage.setItem('lastIP', ip);
            $('status').innerText = "LOCKED!";
            $('ip_found').innerText = "Ditemukan di: " + ip;
            startLoop();
        }

        // 1. Scan IP otomatis (diulang sampai ketemu)
        // Awalan 2 bagian (mis. 192.168)  -> coba 192.168.0.99 ... 192.168.255.99   (Wemos dikunci di .99)
        // Awalan 3 bagian (mis. 192.168.43) -> coba 192.168.43.1 ... 192.168.43.254
        // IP lengkap (mis. 192.168.43.57)   -> coba alamat itu saja
        const FIXED_HOST = 99;

        function buildList(prefix) {
            const parts = prefix.split('.').filter(x => x !== '');
            const list = [];
            const last = localStorage.getItem('lastIP');
            if (last) list.push(last);                       // IP terakhir dicoba paling dulu
            if (parts.length === 4) {
                list.push(parts.join('.'));                  // IP lengkap -> coba langsung 1 alamat itu
            } else if (parts.length === 2) {
                for (let c = 0; c <= 255; c++) list.push(`${parts[0]}.${parts[1]}.${c}.${FIXED_HOST}`);
            } else if (parts.length === 3) {
                list.push(`${parts[0]}.${parts[1]}.${parts[2]}.${FIXED_HOST}`);
                for (let i = 1; i < 255; i++) list.push(`${parts[0]}.${parts[1]}.${parts[2]}.${i}`);
            }
            return list;
        }

        async function startScan() {
            while (!isFound) {
                scanRound++;
                $('status').innerText = "SCANNING... (putaran " + scanRound + ")";
                const prefix = $('prefix').value.trim();
                localStorage.setItem('prefix', prefix);
                const list = buildList(prefix);
                if (list.length === 0) { $('dbg').innerText = "Isian tidak valid (contoh: 192.168.43.57)"; }

                // dikirim bertahap (64 sekaligus) supaya HP tidak kewalahan
                for (let i = 0; i < list.length && !isFound; i += 64) {
                    await Promise.allSettled(list.slice(i, i + 64).map(ip =>
                        req(ip).then(d => { if (d.core === "DUMMY") found(ip); })
                               .catch(e => { lastErr = e.name + ": " + e.message; })
                    ));
                }
                if (!isFound) {
                    $('dbg').innerText = "Belum ketemu. Error terakhir: " + (lastErr || "-");
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }

        // 2. Loop ambil data
        function startLoop() {
            setInterval(() => {
                req(wemosIP).then(d => {
                    $('rpm').innerText = d.rpm;
                    $('dbg').innerText = "";
                }).catch(e => { $('dbg').innerText = "Data gagal: " + e.name + ": " + e.message; });
            }, 100);
        }

        // 3. GPS HP (butuh HTTPS atau localhost)
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                let kmh = Math.round((pos.coords.speed || 0) * 3.6);
                $('speed').innerText = kmh;
                $('gps_stat').innerText = "GPS: LOCKED";
            }, (err) => {
                $('gps_stat').innerText = "GPS ERROR: " + err.message;
            }, { enableHighAccuracy: true });
        } else {
            $('gps_stat').innerText = "GPS tidak didukung browser ini";
        }

        $('prefix').value = localStorage.getItem('prefix') || "192.168";
        startScan();
    </script>
</body>
</html>
